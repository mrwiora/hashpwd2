name: Integration Tests
permissions:
  contents: read

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev xorg-dev libxtst-dev libpng++-dev
          sudo apt-get install -y xcb libxcb-xkb-dev x11-xkb-utils libx11-xcb-dev
          sudo apt-get install -y libxkbcommon-x11-dev libxkbcommon-dev

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -v -timeout 10m ./...
        env:
          CGO_ENABLED: 1
